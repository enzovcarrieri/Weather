<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Roulette</title>
<style>
  :root{
    --card-bg: rgba(255,255,255,0.16);
    --card-border: rgba(255,255,255,0.32);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.72);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#0b0b0e;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #stage{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    width:100%; height:100%;
  }
  #poster{
    position:relative;
    aspect-ratio: 210 / 297;
    height: 90vh;
    max-width: 92vw;
    border-radius: 22px;
    overflow:hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 4px 20px rgba(0,0,0,0.4);
    transition: background 1.1s ease;
    color: var(--text);
    display:flex; flex-direction:column;
  }
  /* tighter sizing for scripted screenshot exports (?export=1), so poster + hints fit with clean margins */
  html.export-mode #poster{ height: 84vh; }
  html.export-mode #stage{ gap: 26px; }
  /* decorative drifting atmosphere blobs for a "satellite/weather" feel */
  .blob{
    position:absolute; border-radius:50%;
    filter: blur(60px);
    opacity:0.35;
    background: rgba(255,255,255,0.5);
    mix-blend-mode: overlay;
    pointer-events:none;
    animation: drift 26s ease-in-out infinite;
  }
  .blob.b1{ width:60%; height:26%; top:-6%; left:-10%; animation-duration: 30s; }
  .blob.b2{ width:50%; height:22%; bottom:6%; right:-12%; animation-duration: 22s; animation-delay:-8s; }
  .blob.b3{ width:40%; height:18%; top:38%; left:30%; animation-duration: 34s; animation-delay:-4s; opacity:0.2;}
  @keyframes drift{
    0%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(4%, 3%) scale(1.08); }
    100%{ transform: translate(0,0) scale(1); }
  }

  header.top{
    position:relative; z-index:2;
    padding: 6.5% 8% 0 8%;
    display:flex; flex-direction:column; gap:2px;
  }
  header.top .city{
    font-size: clamp(28px, 6.2vw, 46px);
    font-weight: 600;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 18px rgba(0,0,0,0.25);
  }
  header.top .meta{
    font-size: clamp(12px, 2.1vw, 15px);
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  main.center{
    position:relative; z-index:2;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 0 6%;
  }
  .temp{
    font-size: clamp(90px, 20vw, 170px);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 30px rgba(0,0,0,0.25);
  }
  .temp sup{
    font-size: 0.34em;
    font-weight: 200;
    vertical-align: 20%;
  }
  .condition{
    display:flex; align-items:center; gap:10px;
    margin-top: 6px;
  }
  .condition svg{ width: clamp(28px,5vw,38px); height: clamp(28px,5vw,38px); }
  .condition .label{
    font-size: clamp(16px, 3vw, 21px);
    font-weight: 600;
  }
  .feels{
    margin-top: 8px;
    font-size: clamp(12px, 2vw, 14px);
    color: var(--text-dim);
    font-weight: 500;
  }

  footer.cards{
    position:relative; z-index:2;
    display:grid;
    grid-template-columns: 1fr 1fr 1.15fr;
    gap: 3.2%;
    padding: 0 6% 7% 6%;
  }
  .card{
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border-radius: 18px;
    padding: 10px 12px;
    display:flex; flex-direction:column; gap:6px;
    min-height: 108px;
  }
  .card .card-title{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-weight: 600;
  }
  .card .card-main{
    display:flex; align-items:center; gap:8px;
    font-size: clamp(16px,3vw,20px);
    font-weight: 600;
    margin-top: auto;
  }
  .card .card-sub{
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .wind-arrow{
    width: 20px; height:20px;
    transition: transform 0.6s ease;
  }
  .map-card svg{ width:100%; height: 56px; }
  .map-card .card-sub{ margin-top:2px; }

  #hint{
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .hint-row{
    -webkit-appearance: none; appearance: none;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    display:flex; align-items:center; gap:9px;
    background:none; border:none; margin:0;
    font-family: inherit;
    padding: 11px 14px;
    border-radius: 14px;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .hint-row:hover{ background: rgba(255,255,255,0.06); }
  .hint-row:active{ background: rgba(255,255,255,0.12); transform: scale(0.97); }
  .keycap{
    display:inline-flex; align-items:center; justify-content:center;
    height: 22px; min-width: 22px;
    padding: 0 6px;
    border-radius: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 1px 3px rgba(0,0,0,0.3);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    color: rgba(255,255,255,0.8);
    flex: none;
  }
  .keycap.keycap-space{ width: 46px; }
  .keycap.keycap-return{ font-size: 14px; }
  .or-click{ opacity:0.6; font-style:italic; font-weight:500; }

  @media print{
    html,body{ background:none; height:auto; }
    #hint{ display:none; }
    #poster{
      height: 297mm; width:210mm; max-width:none;
      border-radius:0; box-shadow:none;
    }
    @page{ size: A4 portrait; margin:0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="poster">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>

      <header class="top">
        <div class="city" id="city">—</div>
        <div class="meta" id="meta">carregando…</div>
      </header>

      <main class="center">
        <div class="temp" id="temp">--<sup>°</sup></div>
        <div class="condition">
          <span id="icon"></span>
          <span class="label" id="condLabel">—</span>
        </div>
        <div class="feels" id="feels">&nbsp;</div>
      </main>

      <footer class="cards">
        <div class="card">
          <div class="card-title" id="titleWind">Vento</div>
          <div class="card-main">
            <svg class="wind-arrow" id="windArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="21" x2="12" y2="3"></line>
              <polyline points="5 10 12 3 19 10"></polyline>
            </svg>
            <span id="windSpeed">--</span>
          </div>
          <div class="card-sub" id="windDir">-- km/h</div>
        </div>

        <div class="card">
          <div class="card-title" id="titlePrecip">Precipitação</div>
          <div class="card-main">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.7s6 6.6 6 11.2a6 6 0 0 1-12 0c0-4.6 6-11.2 6-11.2z"></path>
            </svg>
            <span id="precip">--</span>
          </div>
          <div class="card-sub" id="humidity">umidade --%</div>
        </div>

        <div class="card map-card">
          <div class="card-title" id="titleLocation">Localização</div>
          <svg id="mapSvg" viewBox="0 0 200 100" preserveAspectRatio="none"></svg>
          <div class="card-sub" id="coords">-- , --</div>
        </div>
      </footer>
    </div>

    <div id="hint">
      <button type="button" class="hint-row" id="btnCity">
        <span class="keycap keycap-space" aria-hidden="true"></span>
        <span class="or-click" id="orClickCity">or click</span>
        <span id="hintCity">TO CHANGE CITY</span>
      </button>
      <button type="button" class="hint-row" id="btnUnit">
        <span class="keycap keycap-return" aria-hidden="true">⏎</span>
        <span class="or-click" id="orClickUnit">or click</span>
        <span id="hintUnit">TO CHANGE TO FAHRENHEIT</span>
      </button>
      <button type="button" class="hint-row" id="btnLang">
        <span class="keycap keycap-letter" aria-hidden="true">W</span>
        <span class="or-click" id="orClickLang">or click</span>
        <span id="hintLang">TO CHANGE LANGUAGE</span>
      </button>
    </div>
  </div>

// shuffle once so each session gets a fresh random order
for(let i=CITIES.length-1;i>0;i--){
  const j = Math.floor(Math.random()*(i+1));
  [CITIES[i],CITIES[j]]=[CITIES[j],CITIES[i]];
}

// optional URL params for scripted screenshots/exports: ?city=Tokyo&lang=en&unit=F&export=1
const _params = new URLSearchParams(location.search);
let idx = 0;
{
  const wantedCity = _params.get("city");

let clockTimer = null;
let refreshTimer = null;

// --- color: frio = azul forte, meio termo = amarelo, quente = vermelho ---
function tempToBackground(t){
  // straight blue->yellow RGB blending turns muddy grey/olive in the middle,
  // so we route through a soft pale stop to keep every step vivid.
  const COLD = [18, 68, 163];    // azul forte
  const PALE = [222, 216, 192];  // transição neutra e clara (leve tom areia)
  const MID  = [250, 200, 60];   // amarelo
  const HOT  = [195, 35, 35];    // vermelho

  const coldPoint = 3, palePoint = 11, midPoint = 19, hotPoint = 33;
  let c;
  if(t <= coldPoint) c = COLD;
  else if(t >= hotPoint) c = HOT;
  else if(t <= palePoint) c = lerpRGB(COLD, PALE, (t - coldPoint) / (palePoint - coldPoint));
  else if(t <= midPoint) c = lerpRGB(PALE, MID, (t - palePoint) / (midPoint - palePoint));
  else c = lerpRGB(MID, HOT, (t - midPoint) / (hotPoint - midPoint));

  const c2 = c.map(v => Math.max(0, Math.min(255, Math.round(v*0.72))));
  return `linear-gradient(160deg, rgb(${c.join(",")}) 0%, rgb(${c2.join(",")}) 100%)`;
}
function lerpRGB(a,b,f){ return [0,1,2].map(i => a[i] + (b[i]-a[i])*f); }

// --- weather code -> icon + label key ---
const WEATHER_ICONS = {
  sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path></svg>`,
  cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 18a4 4 0 0 1-.5-7.97A5 5 0 0 1 15.9 8.1 4.5 4.5 0 0 1 17.5 18h-11z"></path></svg>`,
  cloudSun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v2M19.8 5.2l-1.4 1.4M4 13a4 4 0 0 0 .5 8h10a4 4 0 0 0 .3-8 5 5 0 0 0-9.6-1.5A4 4 0 0 0 4 13z"></path><circle cx="13" cy="9" r="3"></circle></svg>`,
  rain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15a4 4 0 0 1-.5-7.97A5 5 0 0 1 15.9 5.1 4.5 4.5 0 0 1 17.5 15h-11z"></path><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg>`,
  snow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 14a4 4 0 0 1-.5-7.97A5 5 0 0 1 15.9 4.1 4.5 4.5 0 0 1 17.5 14h-11z"></path><path d="M8 18v3M8 18l-1.7 1M8 18l1.7 1M16 18v3M16 18l-1.7 1M16 18l1.7 1"></path></svg>`,
  storm: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 13a4 4 0 0 1-.5-7.97A5 5 0 0 1 15.9 3.1 4.5 4.5 0 0 1 17.5 13h-11z"></path><path d="M13 15l-3 4h3l-2 4"></path></svg>`,
  fog: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M2 13h20M4 17h16"></path></svg>`,
};

const WEATHER_CODE_MAP = {
  0:["sun","clear"], 1:["cloudSun","fewClouds"], 2:["cloudSun","partlyCloudy"], 3:["cloud","cloudy"],
  45:["fog","fog"], 48:["fog","fog"],
  51:["rain","drizzleLight"], 53:["rain","drizzle"], 55:["rain","drizzleHeavy"],
  56:["rain","freezingDrizzle"], 57:["rain","freezingDrizzle"],
  61:["rain","rainLight"], 63:["rain","rain"], 65:["rain","rainHeavy"],
  66:["rain","freezingRain"], 67:["rain","freezingRain"],
  71:["snow","snowLight"], 73:["snow","snow"], 75:["snow","snowHeavy"], 77:["snow","snowGrains"],
  80:["rain","showers"], 81:["rain","showers"], 82:["rain","showersHeavy"],
  85:["snow","snowShowers"], 86:["snow","snowShowers"],
  95:["storm","thunderstorm"], 96:["storm","thunderstormHail"], 99:["storm","thunderstormHail"],
};

function weatherVisual(code, lang){
  const [iconKey, labelKey] = WEATHER_CODE_MAP[code] || ["cloud", null];
  const icon = WEATHER_ICONS[iconKey];
  const label = labelKey ? WEATHER_LABELS[lang][labelKey] : "—";
  return [icon, label];
}

function compass(deg, lang){
  const dirs = COMPASS[lang];
  return dirs[Math.round(deg/22.5) % 16];
}

function drawMap(lat, lon){
  const w=200,h=100;
  let lines = "";
  for(let g=-150; g<=150; g+=30){
    const x = (g+180)/360*w;
    lines += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="rgba(255,255,255,0.16)" stroke-width="0.5"/>`;
  }
  for(let g=-60; g<=60; g+=30){
    const y = (90-g)/180*h;
    lines += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="rgba(255,255,255,0.16)" stroke-width="0.5"/>`;
  }
  lines += `<line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="rgba(255,255,255,0.32)" stroke-width="0.7"/>`;
  lines += `<line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="rgba(255,255,255,0.32)" stroke-width="0.7"/>`;

  const px = (lon+180)/360*w;
  const py = (90-lat)/180*h;
  const pin = `
    <circle cx="${px}" cy="${py}" r="7" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1">
      <animate attributeName="r" values="4;9;4" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="${px}" cy="${py}" r="3.2" fill="#ffffff"/>
  `;
  el.mapSvg.innerHTML = lines + pin;
}

function fmtCoord(v, posLabel, negLabel){
  return `${Math.abs(v).toFixed(2)}° ${v>=0?posLabel:negLabel}`;
}

function celsiusToF(c){ return c*9/5+32; }

let lastCity = null;
let lastCur = null;
let loadFailed = false;
let nowStr = "";

function lang(){ return LANGS[langIdx]; }

function startClock(city){
  if(clockTimer) clearInterval(clockTimer);
  const tick = () => {
    nowStr = new Intl.DateTimeFormat("en-GB", {
      timeZone: city.tz, hour:"2-digit", minute:"2-digit", hour12:false
    }).format(new Date());
    render();
  };
  tick();
  clockTimer = setInterval(tick, 1000*15);
}

function render(){
  if(!lastCity) return;
  const t = UI[lang()];
  const names = lastCity.i18n[lang()];

  el.city.textContent = names.city;
  el.meta.textContent = loadFailed ? `${names.country} · ${t.failLoad}` : `${names.country} · ${t.localTime(nowStr)}`;
  el.coords.textContent = `${fmtCoord(lastCity.lat,"N","S")}, ${fmtCoord(lastCity.lon,t.lon.pos,t.lon.neg)}`;

  el.titleWind.textContent = t.wind;
  el.titlePrecip.textContent = t.precipitation;
  el.titleLocation.textContent = t.location;

  el.hintCity.textContent = t.hintCity;
  el.hintUnit.textContent = t.hintUnit(t.unitName[unit === "C" ? "F" : "C"]);
  el.hintLang.textContent = t.hintLang;
  el.orClickCity.textContent = t.orClick;
  el.orClickUnit.textContent = t.orClick;
  el.orClickLang.textContent = t.orClick;

  if(!lastCur) return;

  const tempC = lastCur.temperature_2m;
  const feelsC = lastCur.apparent_temperature;
  const displayTemp = unit === "C" ? tempC : celsiusToF(tempC);
  const displayFeels = unit === "C" ? feelsC : celsiusToF(feelsC);

  el.poster.style.background = tempToBackground(tempC);
  el.temp.innerHTML = `${Math.round(displayTemp)}<sup>°</sup>`;
  el.feels.textContent = t.feelsLike(Math.round(displayFeels));

  const [icon, label] = weatherVisual(lastCur.weather_code, lang());
  el.icon.innerHTML = icon;
  el.condLabel.textContent = label;

  el.windSpeed.textContent = `${Math.round(lastCur.wind_speed_10m)} km/h`;
  el.windDir.textContent = `${compass(lastCur.wind_direction_10m, lang())} · ${Math.round(lastCur.wind_direction_10m)}°`;
  el.windArrow.style.transform = `rotate(${lastCur.wind_direction_10m}deg)`;

  el.precip.textContent = `${lastCur.precipitation.toFixed(1)} mm`;
  el.humidity.textContent = t.humidity(Math.round(lastCur.relative_humidity_2m));
}

async function loadCity(city){
  lastCity = city;
  lastCur = null;
  loadFailed = false;
  drawMap(city.lat, city.lon);
  startClock(city);
  render();

  const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&timezone=${encodeURIComponent(city.tz)}`;

  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error("network");
    const data = await res.json();
    lastCur = data.current;
  }catch(err){
    loadFailed = true;
  }
  render();
}

function next(){
  idx = (idx + 1) % CITIES.length;
  loadCity(CITIES[idx]);
}

function toggleUnit(){
  unit = unit === "C" ? "F" : "C";
  render();
}

function cycleLanguage(){
  langIdx = (langIdx + 1) % LANGS.length;
  render();
}

window.addEventListener("keydown", (e) => {
  if(e.code === "Space"){
    e.preventDefault();
    next();
  } else if(e.key === "Enter"){
    e.preventDefault();
    toggleUnit();
  } else if(e.key && e.key.toLowerCase() === "w"){
    cycleLanguage();
  }
});
el.poster.addEventListener("click", next);

// tappable on mobile (no keyboard) — same actions as the keyboard shortcuts above
document.getElementById("btnCity").addEventListener("click", next);
document.getElementById("btnUnit").addEventListener("click", toggleUnit);
document.getElementById("btnLang").addEventListener("click", cycleLanguage);

loadCity(CITIES[idx]);
if(refreshTimer) clearInterval(refreshTimer);
refreshTimer = setInterval(() => loadCity(CITIES[idx]), 5*60*1000);
